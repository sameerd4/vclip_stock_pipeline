name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,visual]"
      - name: Check new workflow for Python errors
        run: >-
          python -m ruff check
          src/vclip_pipeline/workflow
          tests/test_review_shard.py
          tests/test_export_ingest.py
          tests/test_workflow_catalog.py
          tests/test_openai_visual_provider.py
          --select F
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest
